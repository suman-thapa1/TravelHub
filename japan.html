<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan</title>
    <link rel="stylesheet" href="places.css">
</head>
<body class="japan">

    <h2>Explore Japan 🌸⛩️</h2>

    <div class="cards">

        <!-- CARD 1 -->
        <label class="card">
            
            <input type="checkbox" name="place">
            <img src="images/tokyo.png" alt="Tokyo">
            <h4>Tokyo</h4>
            <p>A modern city known for it's technology, shopping, and vibrant nightlife.</p>
            <p class="price">$1200</p>
        </label>

        <!-- CARD 2 -->
        <label class="card">
            <input type="checkbox" name="place">
            <img src="images/kyoto.png" alt="Kyoto">
            <h4>Kyoto</h4>
            <p>This place is famous for it's temples, traditional culture, and beautiful cherry blossoms.</p>
            <p class="price">$1100</p>
        </label>
        

        <!-- CARD 3 -->
        <label class="card">
            <input type="checkbox" name="place">
            <img src="images/mountfuji.png" alt="Mount Fuji">
            <h4>Mount Fuji</h4>
            <p>The most beautiful and iconic mountain of Japan, popular for hiking and scenic views.</p>
            <p class="price">$1500</p>
        </label>

    </div>

    <!-- BACK BUTTON -->
     <button class="book-btn" onclick="window.location.href='index.html#booking'">
        Book now 
    </button>
    <button onclick="window.location.href='index.html#destination'">Back</button>
    <footer>
    <p>© 2026 TravelHub | All Rights Reserved</p>
    </footer>

</body>
</html>
