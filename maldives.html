<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maldives</title>
    <link rel="stylesheet" href="places.css">
</head>
<body class="maldives">

    <h2>Explore Maldives🏝️</h2>
    <p class="intro">Discover the beauty of crystal clear white sandy beaches, and luxury island life.</p>


    <div class="cards">

        <label class="card">
            <input type="checkbox" name="place">
            <img src="images/background_image.jpeg" alt="Malé">
            <h4>Malé</h4>
            <p>The capital city of maldives offering you with local culture, markets, and historic landmarks.</p>
            <p class="price">$200</p>
        </label>

        <label class="card">
            <input type="checkbox" name="place">
            <img src="images/maafushi.png" alt="Maafushi">
            <h4>Maafushi Island</h4>
            <p>A island known for water sports and snorkeling and also a budget-friendly spot.</p>
            <p class="price">$250</p>
        </label>

        <label class="card">
            <input type="checkbox" name="place">
            <img src="images/Vaadhoo.png" alt="Vaadhoo">
            <h4>Vaadhoo Island</h4>
            <p>Famous glowing sea which glows during night.</p>
            <p class="price">$300</p>
        </label>

    </div>
    <button class="book-btn" onclick="window.location.href='index.html#booking'">
        Book now 
    </button>
    <button onclick="window.location.href='index.html#destination'">Back</button>
    
    <footer>
    <p>© 2026 TravelHub | All Rights Reserved</p>
    </footer>

    

</body>
</html>
